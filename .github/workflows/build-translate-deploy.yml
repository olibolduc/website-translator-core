name: Reusable Build and Deploy

on:
  workflow_call:
    inputs:
      node-version:
        required: false
        type: string
        default: '20'
      source-lang:
        required: true
        type: string
      source-locale:
        required: false
        type: string
        default: ''
      target-lang:
        required: true
        type: string
      target-locale:
        required: false
        type: string
        default: ''
      site-url:
        required: true
        type: string
    secrets:
      GEMINI_API_KEY:
        required: true
      NETLIFY_AUTH_TOKEN:
        required: true
      NETLIFY_SITE_ID:
        required: true

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Site Code
        uses: actions/checkout@v4

      - name: Checkout Translator Engine
        uses: actions/checkout@v4
        with:
          repository: olibolduc/website-translator-core
          path: engine
          token: ${{ secrets.GITHUB_TOKEN }} # Needs access if repo is private

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}

      - name: Install Engine Dependencies
        run: |
          cd engine
          npm install

      - name: Translate and Build
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          # Run the translator from the engine directory against the site root
          # Source = .. (Site Root)
          # Target = ../dist (Output)
          cd engine
          
          # Build command with conditional locale parameters
          CMD="node src/index.js translate .. ../dist --source-lang ${{ inputs.source-lang }} --lang ${{ inputs.target-lang }} --url ${{ inputs.site-url }}"
          
          # Add source-locale if provided
          if [ -n "${{ inputs.source-locale }}" ]; then
            CMD="$CMD --source-locale ${{ inputs.source-locale }}"
          fi
          
          # Add target-locale if provided
          if [ -n "${{ inputs.target-locale }}" ]; then
            CMD="$CMD --target-locale ${{ inputs.target-locale }}"
          fi
          
          # Execute the command
          eval $CMD

      - name: Commit Translations Cache
        run: |
          cd engine
          # translations.json is now written directly to the site root (..) by the engine
          
          cd ..
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          if [ -f translations.json ]; then
            git add -f translations.json
            # Check if there are changes to commit
            if ! git diff --quiet || ! git diff --staged --quiet; then
              git commit -m "Update translations cache [skip ci]"
              # Use -X theirs to favor the current build's cache in case of conflict
              # In rebase, 'theirs' refers to the local changes being replayed
              git pull --rebase -X theirs origin main
              git push
            fi
          fi

      - name: Deploy to Netlify
        uses: nwtgck/actions-netlify@v3.0
        with:
          publish-dir: './dist'
          production-branch: main
          github-token: ${{ secrets.GITHUB_TOKEN }}
          deploy-message: "Deploy from GitHub Actions"
          enable-pull-request-comment: false
          enable-commit-comment: true
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
